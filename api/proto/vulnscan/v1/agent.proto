syntax = "proto3";

package vulnscan.v1;

option go_package = "vuln-scanner/api/gen/vulnscan/v1;vulnscanv1";

service AgentService {
  rpc Auth(AuthRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc SyncInventory(SyncInventoryRequest) returns (SyncInventoryResponse);
  rpc SyncCompliance(SyncComplianceRequest) returns (SyncComplianceResponse);
  rpc FetchPatchTasks(FetchPatchTasksRequest) returns (FetchPatchTasksResponse);
  rpc ReportPatchTask(ReportPatchTaskRequest) returns (ReportPatchTaskResponse);
  rpc ReportPatchProgress(ReportPatchProgressRequest) returns (ReportPatchProgressResponse);
  rpc FetchRuntimeVerifyTasks(FetchRuntimeVerifyTasksRequest) returns (FetchRuntimeVerifyTasksResponse);
  rpc ReportRuntimeVerify(ReportRuntimeVerifyRequest) returns (ReportRuntimeVerifyResponse);
  rpc FetchNetworkScanTasks(FetchNetworkScanTasksRequest) returns (FetchNetworkScanTasksResponse);
  rpc SyncNetworkScan(SyncNetworkScanRequest) returns (SyncNetworkScanResponse);
}

message AuthRequest {
  string agent_id = 1;
  string fingerprint = 2;
}

message AuthResponse {
  string token = 1;
  int64 expires_in = 2;
  string grpc_addr = 3;
  string status = 4;
  string message = 5;
}

message RefreshTokenRequest {
  string agent_id = 1;
  string token = 2;
  string fingerprint = 3;
}

message RefreshTokenResponse {
  string token = 1;
  int64 expires_in = 2;
}

message HeartbeatRequest {
  string agent_id = 1;
  string token = 2;
  int64 collector_errors = 3;
}

message HeartbeatResponse {
  bool ok = 1;
}

message SyncInventoryRequest {
  string agent_id = 1;
  string token = 2;
  SyncMode mode = 3;
  repeated Asset assets = 4;
  SystemInfo system_info = 5;
}

message SyncInventoryResponse {
  bool ok = 1;
  int64 received_count = 2;
}

message SyncComplianceRequest {
  string agent_id = 1;
  string token = 2;
  ComplianceReport compliance = 3;
}

message SyncComplianceResponse {
  bool ok = 1;
}

message ComplianceReport {
  string benchmark = 1;
  double score = 2;
  int32 total = 3;
  int32 passed = 4;
  int32 failed = 5;
  int32 na = 6;
  repeated ComplianceCheck checks = 7;
  string checked_at = 8;
}

message ComplianceCheck {
  string id = 1;
  string title = 2;
  string group = 3;
  string status = 4; // pass | fail | na
  string evidence = 5;
}

message PatchTaskInfo {
  int64 id = 1;
  string asset_name = 2;
  string fix_type = 3;
  string fix_value = 4;
  string command = 5;
  repeated CommandArgv commands = 6;
  bool dry_run = 7;
  bool cancel_requested = 8;
}

message CommandArgv {
  repeated string argv = 1;
}

message FetchPatchTasksRequest {
  string agent_id = 1;
  string token = 2;
}

message FetchPatchTasksResponse {
  repeated PatchTaskInfo tasks = 1;
}

message ReportPatchTaskRequest {
  int64 task_id = 1;
  string agent_id = 2;
  string token = 3;
  string status = 4;
  int32 exit_code = 5;
  string output = 6;
}

message ReportPatchTaskResponse {
  bool ok = 1;
}

message ReportPatchProgressRequest {
  int64 task_id = 1;
  string agent_id = 2;
  string token = 3;
  string stream = 4; // stdout | stderr
  string data = 5;
}

message ReportPatchProgressResponse {
  bool ok = 1;
  bool cancel_requested = 2;
}

message NetworkScanTaskInfo {
  int64 id = 1;
  string target = 2;
  repeated int32 ports = 3;
}

message FetchNetworkScanTasksRequest {
  string agent_id = 1;
  string token = 2;
}

message FetchNetworkScanTasksResponse {
  repeated NetworkScanTaskInfo tasks = 1;
}

message NetworkService {
  int32 port = 1;
  string protocol = 2; // tcp
  string service = 3;  // canonical product/service name
  string version = 4;
  string banner = 5;
}

message NetworkHost {
  string ip = 1;
  string hostname = 2;
  string os_type = 3; // windows | linux | unknown
  repeated NetworkService services = 4;
}

message SyncNetworkScanRequest {
  string agent_id = 1;
  string token = 2;
  int64 task_id = 3;    // 0 = scheduled scan
  string scan_mode = 4; // scheduled | manual
  string scanned_at = 5;
  repeated NetworkHost hosts = 6;
  string error = 7;
}

message SyncNetworkScanResponse {
  bool ok = 1;
  int64 received_count = 2;
}

enum SyncMode {
  FULL = 0;
  INCREMENTAL = 1;
}

message Asset {
  string name = 1;
  string version = 2;
  string arch = 3;
  string format = 4;
  string vendor = 5;
  string location = 6;
  string install_date = 7;
  string status = 8;
  AssetType type = 9;
}

message SystemInfo {
  string hostname = 1;
  string os = 2;
  string version = 3;
  string arch = 4;
  string machine_id = 5;
  string system_manufacturer = 6;
  string system_model = 7;
  string system_serial = 8;
  int64 memory_mb = 9;
  repeated CPUSpec cpu = 10;
  repeated GPUSpec gpu = 11;
  MotherboardSpec motherboard = 12;
  repeated NetInterfaceSpec net_interfaces = 13;
  repeated PortInfo open_ports = 14;
  repeated ProcessInfo processes = 15;
  repeated StorageSpec storage = 16;
  string bios_version = 17;
  string bios_date = 18;
  string kernel_version = 19;
  int64 uptime_seconds = 20;
  string boot_time = 21;
  string timezone = 22;
  string os_domain = 23;
  repeated MemoryModule memory_modules = 24;
  repeated ServiceInfo services = 25;
  repeated StartupItem startup_items = 26;
  repeated ScheduledTask scheduled_tasks = 27;
  repeated RouteInfo routes = 28;
  repeated FirewallRule firewall_rules = 29;
  repeated NeighborInfo neighbors = 30;
  repeated CertificateInfo certificates = 31;
  repeated AccountInfo accounts = 32;
  repeated SSHKeyInfo ssh_keys = 33;
  repeated RuntimeInfo runtimes = 34;
  bool tpm_enabled = 35;
  string disk_encryption = 36;
  string antivirus = 37;
  string selinux = 38;
  string apparmor = 39;
  repeated string truncated = 40;
  repeated UpdateFact update_facts = 41;
  UpdateSourceStatus update_source_status = 42;
  repeated EDRFinding edr_findings = 43;
}

message UpdateFact {
  string kb = 1;
  string title = 2;
  string state = 3; // installed | pending
  string severity = 4;
  bool reboot_required = 5;
  string source = 6; // wua | wsus | mu
  string collected_at = 7;
}

message UpdateSourceStatus {
  bool source_reachable = 1;
  string last_checked_at = 2;
  string error = 3;
}

message CPUSpec {
  string name = 1;
  int32 cores = 2;
}

message GPUSpec {
  string name = 1;
  string driver = 2;
}

message MotherboardSpec {
  string manufacturer = 1;
  string product = 2;
}

message NetInterfaceSpec {
  string name = 1;
  string mac = 2;
  repeated string addresses = 3;
  repeated string gateways = 4;
  repeated string dns = 5;
  string link_speed = 6;
  string driver = 7;
}

message PortInfo {
  string protocol = 1;
  string address = 2;
  int32 port = 3;
  string process = 4;
}

message ProcessInfo {
  int32 pid = 1;
  string name = 2;
  string user = 3;
  int64 memory_mb = 4;
}

message StorageSpec {
  string name = 1;
  int64 size_bytes = 2;
  string mount = 3;
  string serial = 4;
  string model = 5;
  string firmware = 6;
  double usage_percent = 7;
}

message ServiceInfo {
  string name = 1;
  string state = 2;
  string start_type = 3;
  string run_as = 4;
}

message StartupItem {
  string name = 1;
  string command = 2;
  string location = 3;
}

message ScheduledTask {
  string name = 1;
  string status = 2;
  string next_run = 3;
  string command = 4;
}

message RouteInfo {
  string destination = 1;
  string gateway = 2;
  string interface = 3;
  string metric = 4;
}

message FirewallRule {
  string name = 1;
  string enabled = 2;
  string direction = 3;
  string action = 4;
  string protocol = 5;
  string local_port = 6;
  string remote_ip = 7;
}

message NeighborInfo {
  string interface = 1;
  string ip = 2;
  string mac = 3;
  string state = 4;
}

message CertificateInfo {
  string subject = 1;
  string issuer = 2;
  string serial = 3;
  string not_before = 4;
  string not_after = 5;
  string store = 6;
}

message AccountInfo {
  string name = 1;
  string domain = 2;
  string group = 3;
  bool admin = 4;
  bool disabled = 5;
}

message SSHKeyInfo {
  string user = 1;
  string path = 2;
  string type = 3;
  string fingerprint = 4;
}

message MemoryModule {
  string slot = 1;
  int64 capacity_mb = 2;
  string type = 3;
  string speed = 4;
  string serial = 5;
}

message RuntimeInfo {
  string name = 1;
  string type = 2;
  string state = 3;
}

enum AssetType {
  PACKAGE = 0;
  HOTFIX = 1;
  LANGUAGE = 2;
  OS = 3;
}

// EDRFinding is one malicious-software discovery carried with a full
// inventory sync (agent-side ClamAV scan); the server assigns agent_id.
message EDRFinding {
  string source = 1;       // clamav | edr_api
  string finding_type = 2; // malware
  string name = 3;         // detection/virus name
  string severity = 4;     // LOW | MEDIUM | HIGH | CRITICAL
  string path = 5;
  string hash = 6;
  string detail = 7;
}
message RuntimeVerifyTaskInfo {
  int64 task_id = 1;
  string asset_name = 2;
}

message FetchRuntimeVerifyTasksRequest {
  string agent_id = 1;
  string token = 2;
}

message FetchRuntimeVerifyTasksResponse {
  repeated RuntimeVerifyTaskInfo tasks = 1;
}

message ReportRuntimeVerifyRequest {
  int64 task_id = 1;
  string agent_id = 2;
  string token = 3;
  SystemInfo system_info = 4;
}

message ReportRuntimeVerifyResponse {
  bool ok = 1;
  string status = 2;  // passed | failed | na
  string detail = 3;
}
