# VulnScanner Server Configuration - Core Profile
#
# This is the default configuration for the core closed loop:
# asset collection -> CVE matching -> patch recommendation & deployment.
# Advanced modules (cloud/remote/WebDB/container scanning, SIEM, ticketing,
# reporting, LDAP, etc.) are intentionally not listed here. Copy the blocks
# from server.advanced.yaml.example when you need them.

grpc_addr: ":9090"
http_addr: ":8080"
database_url: "postgres://vulnscan:vulnscan@localhost:5432/vulnscan?sslmode=disable"
jwt_secret: "change-me-in-production"
api_key: "sk-change-me"
mode: "all"

# Governance: automatically delete audit entries older than retention_days.
# Set to 0 to keep audit logs forever.
audit:
  retention_days: 365

# Core alerting: alerts are recorded internally by default. Add webhook_url
# and/or smtp below to enable external delivery.
alerting:
  enabled: true
  delivery_interval_seconds: 30
  max_attempts: 3
  sla_check_interval_minutes: 60
  # webhook_url: ""
  # webhook_secret: ""
  # smtp:
  #   host: ""
  #   port: 587
  #   user: ""
  #   password_env: "SMTP_PASSWORD"
  #   from: ""
  #   to: []

# Core patch deployment. Dry-run and approval are on by default; set
# dry_run: false only after you have validated the command templates.
patch:
  enabled: true
  default_approval_required: true
  agent_timeout_seconds: 600
  apt_command: "apt-get install -y --only-upgrade"
  dnf_command: "dnf -y update"
  yum_command: "yum -y update"
  apk_command: "apk upgrade"
  dry_run: true

