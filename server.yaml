# VulnScanner Server Configuration
# 密钥支持 ${ENV} 展开，例如 api_key: "${API_KEY}"。
# 所有占位符均为演示值，部署前必须改为自己的密钥（或使用环境变量）。

grpc_addr: ":9090"
http_addr: ":8080"
database_url: "postgres://vulnscan:vulnscan@localhost:5432/vulnscan?sslmode=disable"
jwt_secret: "change-me-in-production"
api_key: "sk-change-me"

# 运行模式：all（默认，API + gRPC + 后台循环）| api（仅 API/gRPC，不跑循环）| worker（仅后台循环）。
# 水平扩展部署：1×api + N×worker（或 1×all + N×worker）共享同一 PostgreSQL，
# 队列与单例租约由 PostgreSQL 内置 job_queue/worker_leases 协调；也可用 VULNSCAN_MODE 环境变量覆盖。
mode: "all"

# NVD 数据源（可选）。支持 nvd_api_key: "${NVD_API_KEY}" 形式；
# 留空或未配置时自动回退到 NVD_API_KEY 环境变量。
# 两者皆无则按 2 秒间隔限速（无需 key 也可用）。
# cve:
#   nvd_api_key: "${NVD_API_KEY}"
#   # 数据源刷新与缓存（可选，默认值如下）
#   msrc_refresh_minutes: 60
#   nvd_refresh_hours: 3
#   osv_refresh_hours: 6
#   debian_refresh_hours: 6
#   redhat_refresh_hours: 24
#   msrc_ttl_hours: 720
#   nvd_ttl_hours: 168
#   osv_ttl_hours: 12
#   debian_ttl_hours: 168
#   redhat_ttl_hours: 24

# LLM is optional. Uncomment to enable. api_key 支持 ${ENV} 展开。
# llm:
#   provider: "openai"            # openai | anthropic
#   api_key: "${OPENAI_API_KEY}"
#   model: "gpt-4o-mini"
#   auto_analyze:
#     - "CRITICAL"
#     - "HIGH"

