services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vulnscan
      POSTGRES_USER: vulnscan
      POSTGRES_PASSWORD: vulnscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.server
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      DATABASE_URL: postgres://vulnscan:vulnscan@postgres:5432/vulnscan?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      API_KEY: ${API_KEY:-sk-dev-only}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
