  # ===== END PATHS =====
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: admin 级自动化凭证（等同 admin 角色）。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户登录返回的 JWT，按用户角色鉴权。
  responses:
    BadRequest:
      description: 请求参数或请求体不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 缺少或无效的鉴权凭证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 当前角色无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 服务端内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        display_name: {type: string}
        role: {type: string, enum: [admin, operator, viewer]}
        status: {type: string, enum: [active, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time, nullable: true}
    LoginResponse:
      type: object
      properties:
        token: {type: string}
        expires_at: {type: string, format: date-time}
        user:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9_.-]{3,64}$'}
        password: {type: string, minLength: 8}
        display_name: {type: string}
        role: {type: string, enum: [admin, operator, viewer]}
    UpdateUserRequest:
      type: object
      properties:
        display_name: {type: string}
        role: {type: string, enum: [admin, operator, viewer]}
        status: {type: string, enum: [active, disabled]}
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: {type: string, minLength: 8}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        new_password: {type: string, minLength: 8}
    Agent:
      type: object
      properties:
        id: {type: string}
        hostname: {type: string}
        os_type: {type: string}
        os_version: {type: string}
        arch: {type: string}
        agent_ver: {type: string}
        ip: {type: string}
        status: {type: string}
        last_seen: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        eol_status: {type: string, enum: [eol, unsupported, supported, unknown]}
        eol_date: {type: string, format: date, nullable: true}
        eol_product: {type: string}
        eol_cycle: {type: string}
    CVEResult:
      type: object
      properties:
        id: {type: integer, format: int64}
        agent_id: {type: string}
        cve_id: {type: string}
        asset_name: {type: string}
        asset_version: {type: string}
        fixed_version: {type: string}
        fix_state: {type: string}
        kb_article: {type: string}
        kb_url: {type: string}
        verification_source: {type: string}
        advisory_url: {type: string}
        severity: {type: string}
        cvss_score: {type: number, format: double}
        summary: {type: string}
        source: {type: string}
        status: {type: string}
        detected_at: {type: string, format: date-time}
        canonical_cve_id: {type: string}
        epss_score: {type: number, format: double}
        epss_percentile: {type: number, format: double}
        kev: {type: boolean}
        exposure_score: {type: number, format: double}
        asset_criticality: {type: number, format: double}
        risk_score: {type: number, format: double}
        risk_level: {type: string}
    RiskSummary:
      type: object
      properties:
        total_active: {type: integer}
        total_fixed: {type: integer}
        by_risk_level:
          type: object
          additionalProperties: {type: integer}
        by_severity:
