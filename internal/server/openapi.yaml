openapi: 3.0.3
info:
  title: VulnScanner REST API
  version: 1.0.0
  description: |
    VulnScanner 资产漏洞扫描与管理平台 REST API。
    - 鉴权：请求头 `X-API-Key`（admin 级自动化凭证）或用户登录返回的 `Authorization: Bearer <token>`（按角色鉴权），二者任选其一。
    - 角色：`admin` 全部操作；`operator` 日常运维写操作；`viewer` 只读（`/audit-logs*` 仅 admin 可见）。
    - 公开端点：`/health`、`/demo`、`/dl/*`、`/r/*`、`/api/v1/register`、`/api/v1/auth/login`、`/openapi.yaml`。
    - 错误格式统一为 `{"error": "<message>"}`。
servers:
  - url: /
tags:
  - name: system
    description: 健康检查与页面
  - name: downloads
    description: Agent 安装包与安装脚本
  - name: auth
    description: 登录与用户管理
  - name: audit
    description: 统一审计日志（仅 admin）
  - name: agents
    description: Agent 管理与主机遥测
  - name: vulnerabilities
    description: 漏洞结果与修复建议
  - name: patch
    description: 补丁任务与批量 Campaign
  - name: alerting
    description: 告警规则与告警
  - name: risk
    description: 风险治理（仪表盘、汇总、豁免、SLA）
  - name: eol
    description: EOL/停更检测
  - name: compliance
    description: CIS 合规基线
  - name: analysis
    description: LLM 分析与匹配触发
  - name: admin
    description: 管理操作（数据源刷新、报表、CMDB 对账）
  - name: scanning
    description: 扫描策略与容器扫描
  - name: assets
    description: CMDB 资产台账
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /openapi.yaml:
    get:
      tags: [system]
      summary: OpenAPI 规范（本文件）
      security: []
      responses:
        '200':
          description: OpenAPI 3.0.3 YAML 规范
          content:
            application/yaml:
              schema: {type: string}
  /health:
    get:
      tags: [system]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  version: {type: string}
  /demo:
    get:
      tags: [system]
      summary: 测试展示页（HTML）
      security: []
      responses:
        '200':
          description: 展示页 HTML
          content:
            text/html:
              schema: {type: string}
  /dl/agent/{platform}:
    get:
      tags: [downloads]
      summary: 下载 Agent 安装包
      security: []
      parameters:
        - name: platform
          in: path
          required: true
          schema: {type: string, enum: [linux-amd64, linux-arm64, windows-amd64, windows-arm64]}
      responses:
        '200':
          description: Agent 可执行文件
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /dl/{platform}:
    get:
      tags: [downloads]
      summary: 下载 Agent 安装包（兼容别名）
      security: []
      parameters:
        - name: platform
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Agent 可执行文件
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /r/{code}:
    get:
      tags: [downloads]
      summary: 获取一次性安装脚本
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string}
          description: Agent 注册码
      responses:
        '200':
          description: bash 或 PowerShell 安装脚本
          content:
            text/plain:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/register:
    post:
      tags: [auth]
      summary: Agent 注册（使用一次性注册码）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
                hostname: {type: string}
                os_type: {type: string}
                os_version: {type: string}
                arch: {type: string}
      responses:
        '200':
          description: 注册成功，返回 agent_id 与 gRPC 地址
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: {type: string}
                  grpc_addr: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回 JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户信息
      x-roles: [admin, operator, viewer]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: 修改本人密码
      x-roles: [admin, operator, viewer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/users:
    get:
      tags: [auth]
      summary: 用户列表
      x-roles: [admin, operator, viewer]
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      tags: [auth]
      summary: 创建用户
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/users/{userId}:
    put:
      tags: [auth]
      summary: 更新用户（角色/状态/显示名）
      x-roles: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: {type: integer, format: int64}
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [auth]
      summary: 删除用户
      x-roles: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: {type: integer, format: int64}
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/users/{userId}/password:
    post:
      tags: [auth]
      summary: 重置用户密码
      x-roles: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密码已重置
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: {type: integer, format: int64}
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/audit-logs:
    get:
      tags: [audit]
      summary: 查询统一审计日志（仅 admin）
      x-roles: [admin]
      parameters:
        - {name: actor, in: query, required: false, schema: {type: string}, description: 操作人精确匹配}
        - {name: method, in: query, required: false, schema: {type: string}, description: HTTP 方法精确匹配}
        - {name: path, in: query, required: false, schema: {type: string}, description: 路径子串}
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}, description: RFC3339 起始时间}
        - {name: until, in: query, required: false, schema: {type: string, format: date-time}, description: RFC3339 结束时间}
        - {name: limit, in: query, required: false, schema: {type: integer, default: 200, maximum: 1000}}
        - {name: offset, in: query, required: false, schema: {type: integer, default: 0}}
      responses:
        '200':
          description: 审计日志分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/audit-logs/export.csv:
    get:
      tags: [audit]
      summary: 导出审计日志 CSV（最新 5000 条，仅 admin）
      x-roles: [admin]
      responses:
        '200':
          description: CSV 文件
          content:
            text/csv:
              schema: {type: string}
  /api/v1/agents:
    get:
      tags: [agents]
      summary: Agent 列表
      x-roles: [admin, operator, viewer]
      responses:
        '200':
          description: Agent 数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      tags: [agents]
      summary: 手动创建 Agent 并生成注册码
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, platform]
              properties:
                hostname: {type: string}
                platform: {type: string, enum: [linux-amd64, linux-arm64, windows-amd64, windows-arm64]}
      responses:
        '201':
          description: 创建成功，返回注册码与安装命令
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: {type: string}
                  code: {type: string}
                  install_cmd: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/agents/{id}:
    get:
      tags: [agents]
      summary: Agent 详情
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Agent 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [agents]
      summary: 删除 Agent
      x-roles: [admin]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/agents/{id}/vulns:
    get:
      tags: [vulnerabilities]
      summary: Agent 漏洞列表（分页）
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: severity, in: query, required: false, schema: {type: string}, description: 严重级过滤}
        - {name: has_fix, in: query, required: false, schema: {type: boolean}, description: 仅看存在修复的漏洞}
        - {name: page, in: query, required: false, schema: {type: integer, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, default: 50}}
      responses:
        '200':
          description: 漏洞分页结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
                  total: {type: integer}
                  page: {type: integer}
                  page_size: {type: integer}
                  vulnerabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/CVEResult'
  /api/v1/agents/{id}/vulns/{cveId}:
    get:
      tags: [vulnerabilities]
      summary: 单条漏洞详情
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: cveId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 漏洞详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEResult'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agents/{id}/report:
    get:
      tags: [vulnerabilities]
      summary: Agent 完整报告（主机 + 快照 + 漏洞）
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Agent 报告
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    $ref: '#/components/schemas/Agent'
                  snapshot:
                    type: object
                  cves:
                    type: array
                    items:
                      $ref: '#/components/schemas/CVEResult'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agents/{id}/system-info:
    get:
      tags: [agents]
      summary: Agent 主机遥测
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 主机系统信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agents/{id}/update-facts:
    get:
      tags: [agents]
      summary: Agent WUA/WSUS 更新事实
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 更新事实列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  facts:
                    type: array
                    items:
                      type: object
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/agents/{id}/update-status:
    get:
      tags: [agents]
      summary: Agent 更新源状态
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 更新源状态
          content:
            application/json:
              schema:
                type: object
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/agents/{id}/install-command:
    get:
      tags: [agents]
      summary: 获取 Agent 安装命令与注册码
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 注册码与安装命令
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string}
                  install_cmd: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agents/{id}/recommendations:
    get:
      tags: [vulnerabilities]
      summary: Agent 修复建议
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 修复建议列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: {type: string}
                  recommendations:
                    type: array
                    items:
                      type: object
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agents/{id}/patch-tasks/generate:
    post:
      tags: [patch]
      summary: 为 Agent 生成补丁任务
      x-roles: [admin, operator]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePatchTasksRequest'
      responses:
        '201':
          description: 生成的补丁任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: {type: integer}
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatchTask'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agents/{id}/patch-tasks:
    get:
      tags: [patch]
      summary: Agent 补丁任务列表
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, default: 100}}
        - {name: offset, in: query, required: false, schema: {type: integer, default: 0}}
      responses:
        '200':
          description: 补丁任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatchTask'
                  total: {type: integer}
  /api/v1/patch-tasks:
    get:
      tags: [patch]
      summary: 全局补丁任务列表
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: agent_id, in: query, required: false, schema: {type: string}}
        - {name: campaign_id, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: asset_name, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, default: 100, maximum: 200}}
        - {name: offset, in: query, required: false, schema: {type: integer, default: 0}}
      responses:
        '200':
          description: 补丁任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatchTask'
                  total: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/patch-tasks/{taskId}:
    get:
      tags: [patch]
      summary: 补丁任务详情
      x-roles: [admin, operator, viewer]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 补丁任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchTask'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/patch-tasks/{taskId}/approve:
    post:
      tags: [patch]
      summary: 审批补丁任务
      x-roles: [admin, operator]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 状态流转结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: {type: integer, format: int64}
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/patch-tasks/{taskId}/reject:
    post:
      tags: [patch]
      summary: 驳回补丁任务
      x-roles: [admin, operator]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 状态流转结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: {type: integer, format: int64}
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/patch-tasks/{taskId}/cancel:
    post:
      tags: [patch]
      summary: 取消补丁任务
      x-roles: [admin, operator]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 状态流转结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: {type: integer, format: int64}
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/patch-tasks/{taskId}/retry:
    post:
      tags: [patch]
      summary: 重试失败的补丁任务
      x-roles: [admin, operator]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 状态流转结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: {type: integer, format: int64}
                  status: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/patch-campaigns:
    post:
      tags: [patch]
      summary: 按筛选批量生成补丁 Campaign（支持 dry-run）
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePatchCampaignRequest'
      responses:
        '200':
          description: dry-run 演练结果
          content:
